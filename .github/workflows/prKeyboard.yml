
name: Build Fossify Keyboard - Persian PR #474

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR #474
        uses: actions/checkout@v4
        with:
          repository: FossifyOrg/Keyboard
          ref: refs/pull/474/merge
          path: keyboard

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        working-directory: keyboard
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: keyboard
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fossify-Keyboard-Persian-PR474
          path: keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

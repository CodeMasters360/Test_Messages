
name: Build and Release Fossify Keyboard Persian

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download PR source from upstream repository
      - name: Checkout Fossify PR 474
        uses: actions/checkout@v4
        with:
          repository: FossifyOrg/Keyboard
          ref: refs/pull/474/merge
          path: keyboard

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find Android SDK Manager
      - name: Find SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      # 4. Install Android SDK
      - name: Install Android SDK Components
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Prepare project
      - name: Prepare Gradle
        working-directory: keyboard
        run: chmod +x gradlew

      # 7. Build APK
      - name: Build Debug APK
        working-directory: keyboard
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # 8. Find all generated APK files
      - name: Find and Prepare APK
        shell: bash
        run: |
          mkdir -p release-assets

          echo "Searching for APK files..."

          find keyboard -type f -name "*.apk" -print

          find keyboard -type f -name "*.apk" \
            -exec cp {} release-assets/ \;

          APK_COUNT=$(find release-assets -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found!"
            find keyboard -type f -path "*/build/outputs/*" -print
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)"

          ls -lh release-assets/

      # 9. Create automatic release in YOUR repository
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-474-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Fossify Keyboard Persian - Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
